<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlgebraHub - Belajar Algebra dengan Cara Menyenangkan</title>

<!-- Google Fonts: Fredoka for headings/brand, Nunito for body text -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Scattered floating math symbols in the background (purely decorative) -->
  <div class="math-bg" aria-hidden="true">
    <span class="math-symbol" style="top:14%; left:6%; font-size:42px; color:rgba(124,58,237,0.13); --rot:-8deg; animation-duration:7s;">x²</span>
    <span class="math-symbol" style="top:24%; left:14%; font-size:30px; color:rgba(124,58,237,0.12); --rot:6deg; animation-duration:9s;">y</span>
    <span class="math-symbol" style="top:62%; left:5%; font-size:46px; color:rgba(245,158,11,0.16); --rot:-5deg; animation-duration:8s;">π</span>
    <span class="math-symbol" style="top:80%; left:13%; font-size:34px; color:rgba(124,58,237,0.12); --rot:10deg; animation-duration:6.5s;">△</span>
    <span class="math-symbol" style="top:46%; left:2%; font-size:30px; color:rgba(124,58,237,0.1); --rot:0deg; animation-duration:10s;">=</span>
    <span class="math-symbol" style="top:12%; right:30%; font-size:30px; color:rgba(245,158,11,0.18); --rot:8deg; animation-duration:7.5s;">√x</span>
    <span class="math-symbol" style="top:22%; right:7%; font-size:30px; color:rgba(124,58,237,0.14); --rot:-6deg; animation-duration:8.5s;">y = mx + b</span>
    <span class="math-symbol" style="top:46%; right:5%; font-size:40px; color:rgba(124,58,237,0.1); --rot:5deg; animation-duration:9.5s;">∞</span>
    <span class="math-symbol" style="top:70%; right:9%; font-size:44px; color:rgba(245,158,11,0.16); --rot:-10deg; animation-duration:7s;">◺</span>
    <span class="math-symbol" style="top:85%; right:24%; font-size:30px; color:rgba(124,58,237,0.12); --rot:6deg; animation-duration:8s;">+</span>
    <span class="math-symbol" style="top:34%; right:20%; font-size:26px; color:rgba(124,58,237,0.1); --rot:-4deg; animation-duration:10.5s;">÷</span>
  </div>

  <!-- NAV -->
  <div class="nav-wrap">
    <nav class="navbar" id="navbar">
      <!-- Filled in by JS so the "active" highlight can move between buttons -->
    </nav>
  </div>

  <!-- CONTENT (re-rendered by app.js depending on the current view) -->
  <main id="app"></main>

  <script src="app.js"></script>
</body>
</html>
