<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AlgebraHub</title>
<link rel="icon" href="image/favicon.svg" type="image/svg">

<!-- Google Fonts: Fredoka for headings/brand, Nunito for body text -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Scattered floating math symbols in the background (purely decorative) -->
  <div class="math-bg" aria-hidden="true">
    <span class="math-symbol" style="top:8%; left:4%; font-size:48px; color:rgba(124,58,237,0.22); --rot:-10deg; animation-duration:6s;">x²</span>
    <span class="math-symbol" style="top:18%; left:12%; font-size:36px; color:rgba(124,58,237,0.20); --rot:7deg; animation-duration:8s;">y</span>
    <span class="math-symbol" style="top:55%; left:3%; font-size:52px; color:rgba(245,158,11,0.26); --rot:-6deg; animation-duration:7s;">π</span>
    <span class="math-symbol" style="top:75%; left:10%; font-size:40px; color:rgba(124,58,237,0.20); --rot:12deg; animation-duration:6s;">△</span>
    <span class="math-symbol" style="top:40%; left:2%; font-size:35px; color:rgba(124,58,237,0.18); --rot:0deg; animation-duration:9s;">=</span>
    <span class="math-symbol" style="top:6%; right:28%; font-size:38px; color:rgba(245,158,11,0.28); --rot:9deg; animation-duration:6.5s;">√x</span>
    <span class="math-symbol" style="top:28%; right:6%; font-size:32px; color:rgba(124,58,237,0.24); --rot:-7deg; animation-duration:7.5s;">y = mx + b</span>
    <span class="math-symbol" style="top:50%; right:4%; font-size:46px; color:rgba(124,58,237,0.18); --rot:6deg; animation-duration:8.5s;">∞</span>
    <span class="math-symbol" style="top:65%; right:8%; font-size:50px; color:rgba(245,158,11,0.26); --rot:-12deg; animation-duration:6s;">◺</span>
    <span class="math-symbol" style="top:82%; right:22%; font-size:36px; color:rgba(124,58,237,0.20); --rot:8deg; animation-duration:7s;">+</span>
    <span class="math-symbol" style="top:30%; right:18%; font-size:30px; color:rgba(124,58,237,0.18); --rot:-5deg; animation-duration:9.5s;">÷</span>
    <span class="math-symbol" style="top:92%; left:20%; font-size:38px; color:rgba(245,158,11,0.24); --rot:-8deg; animation-duration:7.5s;">α</span>
    <span class="math-symbol" style="top:15%; left:35%; font-size:28px; color:rgba(124,58,237,0.19); --rot:4deg; animation-duration:8.5s;">β</span>
    <span class="math-symbol" style="top:68%; left:25%; font-size:44px; color:rgba(124,58,237,0.21); --rot:-3deg; animation-duration:6.5s;">θ</span>
    <span class="math-symbol" style="top:35%; left:45%; font-size:32px; color:rgba(245,158,11,0.25); --rot:11deg; animation-duration:7s;">∑</span>
    <span class="math-symbol" style="top:88%; left:40%; font-size:26px; color:rgba(124,58,237,0.17); --rot:-6deg; animation-duration:9s;">∂</span>
    <span class="math-symbol" style="top:5%; left:55%; font-size:34px; color:rgba(124,58,237,0.22); --rot:5deg; animation-duration:8s;">λ</span>
    <span class="math-symbol" style="top:48%; left:60%; font-size:42px; color:rgba(245,158,11,0.23); --rot:-9deg; animation-duration:6.5s;">μ</span>
    <span class="math-symbol" style="top:78%; left:50%; font-size:30px; color:rgba(124,58,237,0.19); --rot:3deg; animation-duration:7.5s;">φ</span>
    <span class="math-symbol" style="top:20%; left:75%; font-size:38px; color:rgba(124,58,237,0.21); --rot:-4deg; animation-duration:8.5s;">ω</span>
    <span class="math-symbol" style="top:60%; left:80%; font-size:28px; color:rgba(245,158,11,0.24); --rot:7deg; animation-duration:6s;">Δ</span>
    <span class="math-symbol" style="top:85%; left:65%; font-size:36px; color:rgba(124,58,237,0.18); --rot:-11deg; animation-duration:9s;">∫</span>
    <span class="math-symbol" style="top:38%; left:88%; font-size:32px; color:rgba(245,158,11,0.22); --rot:6deg; animation-duration:7s;">±</span>
    <span class="math-symbol" style="top:72%; left:72%; font-size:40px; color:rgba(124,58,237,0.20); --rot:-7deg; animation-duration:8s;">×</span>
    <span class="math-symbol" style="top:12%; left:92%; font-size:26px; color:rgba(245,158,11,0.25); --rot:4deg; animation-duration:6.5s;">≠</span>
    <span class="math-symbol" style="top:52%; left:18%; font-size:34px; color:rgba(124,58,237,0.23); --rot:-5deg; animation-duration:9.5s;">≤</span>
    <span class="math-symbol" style="top:25%; left:55%; font-size:30px; color:rgba(245,158,11,0.21); --rot:8deg; animation-duration:7s;">≥</span>
    <span class="math-symbol" style="top:95%; left:28%; font-size:38px; color:rgba(124,58,237,0.19); --rot:-3deg; animation-duration:8s;">n√</span>
  </div>

  <!-- NAV -->
  <div class="nav-wrap">
    <nav class="navbar" id="navbar">
      <!-- Filled in by JS so the "active" highlight can move between buttons -->
    </nav>
  </div>

  <!-- CONTENT (re-rendered by app.js depending on the current view) -->
  <main id="app"></main>

  <!-- Background music (loop, starts paused — user presses play) -->
  <audio id="bg-music" src="sound/music_bg.mp3" loop preload="auto"></audio>

  <!-- Owl welcome greeting — MUST be before app.js so getElementById finds it -->
  <audio id="welcome-audio" src="sound/welcome.wav" preload="auto"></audio>
  <audio id="belajar-audio" src="sound/belajar.wav" preload="auto"></audio>
  <audio id="latihan-audio" src="sound/latihan.wav" preload="auto"></audio>
  <audio id="main-audio" src="sound/main.wav" preload="auto"></audio>

  <!-- Chatbot Launcher — bookmark tab on the right edge -->
  <button class="chat-launcher-btn" id="chatLauncher" onclick="ChatBot.toggle()" title="Tanya Algi tentang Algebra">
    <span id="chatLauncherIcon">🦉</span>
    <span class="chat-launcher-label" id="chatLauncherLabel">Tanya Algi</span>
  </button>

  <!-- Chat Window -->
  <div class="chat-window hidden" id="chatWindow">
    <div class="chat-header">
      <div class="chat-header-info">
        <span class="chat-header-owl">🦉</span>
        <div>
          <div class="chat-header-name">Algi</div>
          <div class="chat-header-status">Pembantu AlgebraHub</div>
        </div>
      </div>
      <button class="chat-close-btn" onclick="ChatBot.toggle()">✕</button>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-row">
      <input class="chat-input" id="chatInput" type="text"
        placeholder="Tanya soalan algebra…"
        onkeydown="if(event.key==='Enter')ChatBot.send()">
      <button class="chat-send-btn" onclick="ChatBot.send()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </div>
  </div>

  <script src="app.js"></script>

  <!-- Floating music control widget -->
  <div class="music-player" id="musicPlayer">
    <button class="music-toggle" id="musicToggle" onclick="MusicPlayer.toggle()" title="Main / Berhenti muzik">
      <svg id="iconPlay" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
      <svg id="iconPause" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display:none"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
    </button>
    <span class="music-label">🎵 Muzik Latar</span>
    <input
      class="music-volume"
      id="musicVolume"
      type="range"
      min="0" max="1" step="0.05" value="0.5"
      title="Laraskan kelantangan"
      oninput="MusicPlayer.setVolume(this.value)"
    >
  </div>

  <script>
    const MusicPlayer = {
      audio: document.getElementById('bg-music'),
      toggle() {
        const audio = this.audio;
        if (audio.paused) {
          audio.play();
          document.getElementById('iconPlay').style.display  = 'none';
          document.getElementById('iconPause').style.display = '';
        } else {
          audio.pause();
          document.getElementById('iconPlay').style.display  = '';
          document.getElementById('iconPause').style.display = 'none';
        }
      },
      setVolume(val) {
        this.audio.volume = val;
      }
    };
    // Sync initial volume
    MusicPlayer.audio.volume = 0.5;
    // Background music does NOT auto-play — user must click the play button
    // on the "Muzik Latar" widget to start it.
  </script>
</body>
</html>
